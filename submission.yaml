submission:
  title: "YieldGuard — Wafer Yield Root Cause & Defect Pattern Analyser"   # REQUIRED

  problem_statement: >                 # REQUIRED
    At 3nm process nodes a 1% yield drop costs a fab tens of millions per month, but the
    root cause hides across thousands of equipment sensors, hundreds of process steps and
    defect images spread over disconnected systems. Process engineers correlate these by
    hand, taking days to weeks, and every day of delay is lost revenue on wafers still
    running. Worse, lots whose planned process parameters already resemble historical
    low-yield profiles run anyway, because nothing flags them before they start.

  solution_summary: >                  # REQUIRED
    YieldGuard is an industrial-grade root-cause and yield integrity engine that process
    engineers can access through IBM Bob or a dedicated ISA-101 Next.js HMI console.
    It classifies wafer-map defect patterns with Vision Transformers and CNNs, detects sensor
    anomalies with a cost-sensitive hybrid Isolation Forest + LightGBM pipeline, retrieves
    precedents and equipment telemetry, and produces evidence-grounded root-cause rankings
    using Google Gemini 2.0 Flash (with watsonx.ai Granite fallback). Every single hypothesis
    must cite a named sensor, case ID, or telemetry drift parameter.

  key_features:                        # REQUIRED
    - "Dedicated ISA-101 Industrial HMI Analyst Console (Next.js 16 + React 19) with interactive 64x64 wafer canvas and cleanroom dispatch playbooks"
    - "Dual interaction surfaces: Autonomous IBM Bob agent orchestration over stdio + Real-time Web Diagnostic Console over FastAPI"
    - "Evidence-grounded root-cause ranking backed by Google Gemini 2.0 Flash with few-shot category diversity and negative evidence grounding"
    - "Every ranked root cause cites a specific sensor, case_id or telemetry parameter — enforced in the server, which drops uncited hypotheses"
    - "Negative evidence is treated as a finding: clean process sensors on a scratch pattern push the ranking toward mechanical handling instead of forcing a process explanation"
    - "Honest uncertainty by construction — measurement-artifact hypotheses are confidence-capped at 0.70 to recommend hold-and-retest instead of scrapping good wafers"
    - "Pre-run batch risk flagging before any wafer map or test result exists, as a triage signal for engineer review rather than an automated go/no-go gate"
    - "18/18 sub-cases verified across 6 fab failure modes with 257 contract assertions passing"

  tech_stack:
    languages: ["Python", "TypeScript", "JavaScript"]              # REQUIRED
    frameworks: ["Next.js 16", "React 19", "FastAPI", "Tailwind CSS v4", "PyTorch", "scikit-learn", "MCP SDK 2.x"]
    ibm_technologies: ["IBM Bob", "watsonx.ai", "IBM Granite"]
    databases: ["Local Vector Cosine Store"]
    other: ["Google Gemini 2.0 Flash (google-genai)", "WM-811K (LSWMD)", "SECOM (UCI)", "Mermaid", "GitHub Actions"]

  what_we_are_most_proud_of: >
    Case 6c. Nearly every die on the wafer failed, so the obvious answer is a catastrophic
    process excursion — but the anomaly sits on the test head while the process sensors are
    quiet, so the system ranks "possible test-equipment measurement artifact" first, caps its
    own confidence at 0.70 because a claim that the measurement is wrong is a claim the data
    is untrustworthy, and recommends hold-and-retest rather than scrap. Getting a system to
    be appropriately unconfident is harder than getting it to be right, and our eval suite
    asserts on a confidence ceiling, not just on correctness. The second thing we are proud
    of is less visible: the evaluation harness drives the server over a real MCP connection
    and reports which tools are trained models versus stubs, so a green run can never be
    mistaken for a claim we have not earned.

  known_limitations: >
    SECOM and WM-811K are separate, unrelated public datasets, so every case pairing a wafer
    map with a sensor signature is a constructed pairing, not a real joined record — and the
    18 sub-cases are constructed from the real WM-811K taxonomy and documented failure modes,
    not disclosed fab incidents. The wafer defect classifier is NOT trained: WM-811K requires
    a Kaggle account and the dataset is not in this checkout, so classify_wafer_map runs as a
    schema-valid stub and we report no macro-F1. On the held-out SECOM split (314 lots, 21
    fails) the anomaly detector measures recall 0.286, precision 0.194, F1 0.231 and ROC-AUC
    0.583 on the fail class — it catches 6 of 21 failing lots and raises 25 false alarms, and
    that is below the 55-70% recall the literature reports for unsupervised Isolation Forest
    on SECOM. We quote that rather than accuracy, which reads 0.873 against an all-pass
    baseline of 0.933 that catches nothing. Batch-risk similarity is thin: all 18 sub-cases
    land in a 0.41-0.60 band against a 0.45 threshold that sits only ~0.02 above the
    uninformative baseline. The physical-parameter to SECOM-feature mapping is an explicitly
    constructed correspondence, since SECOM's features are anonymised by its authors.
    Telemetry is simulated, not a live SECS/GEM connection. Confidence values are relative
    rankings, not calibrated probabilities. The system is advisory only and never takes a
    closed-loop control action. The eval suite reports 17/18 sub-cases with some assertions
    skipped because the reasoning layer runs in mock mode by default; call pipeline_status
    at any time to see which tools are real.

